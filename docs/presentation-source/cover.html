<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Roboto+Mono&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide-container { width: 1280px; min-height: 720px; background: #0B132B; display: flex; flex-direction: column; padding: 48px; position: relative; font-family: 'Inter', sans-serif; }
    .top-motif { position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: #1A659E; }
    .content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    h1 { font-size: 84px; font-weight: 800; color: #FFFFFF; letter-spacing: -0.02em; line-height: 1.1; }
    .subtitle { font-size: 32px; font-weight: 700; color: #F76C5E; margin-top: 24px; text-transform: uppercase; letter-spacing: 0.1em; }
    .meta { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; }
    .meta-text { color: #4B5267; font-size: 18px; line-height: 1.6; }
    .page-num { color: #4B5267; font-size: 12px; font-family: 'Roboto Mono', monospace; }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="top-motif"></div>
    <div class="content">
      <h1>Driver Hub</h1>
      <p class="subtitle">Complete System Overview</p>
    </div>
    <div class="meta">
      <div class="meta-text">
        Django REST API • React Web • Expo Mobile<br>
        Full-Stack Employment Platform
      </div>
      <div class="page-num">01 / 12</div>
    </div>
  </div>
</body>
</html>
